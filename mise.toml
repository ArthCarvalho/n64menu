[tools]
rust = "1.87.0"
zig = "0.16.0"

[tasks.menu]
description = "Build sc64menu.n64"
run = "zig build menu"

[tasks.importer-build]
description = "Build the cross-platform Sokol library importer"
run = "mise --cd tools/library-importer run build"

[tasks.importer-test]
description = "Test the cross-platform library importer"
run = "mise --cd tools/library-importer run test"

[tasks.importer-run]
description = "Run the cross-platform Sokol library importer"
run = "mise --cd tools/library-importer run run"

[tasks.deployer-build]
description = "Build the patched batched sc64deployer"
run = "pwsh -NoProfile -File tools/library-importer/build-deployer.ps1 -OutputDirectory tools/library-importer/zig-out/bin"
