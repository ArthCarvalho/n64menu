name: Build

# Pull requests expose an explicit approval gate; add the `run-ci` label to run builds.
# Manually dispatched runs verify the selected branch and upload workflow artifacts.
# Version tags still build and publish that exact artifact as a GitHub Release.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    tags:
      - "v*"

permissions:
  contents: read
  issues: write

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  approval:
    name: CI approval
    runs-on: ubuntu-latest
    steps:
      - name: Require run-ci label
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'run-ci')
        run: |
          echo "Add the run-ci label to approve the build matrix."
          exit 1
      - name: Consume run-ci approval
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-ci')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method DELETE
          "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/run-ci"

  importer:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-ci')
    needs: windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: m64importer-windows
            package: tools/library-importer/zig-out/m64importer-windows.zip
          - os: ubuntu-latest
            artifact: m64importer-linux
            package: tools/library-importer/zig-out/m64importer-linux.tar.gz
          - os: macos-latest
            artifact: m64importer-macos
            package: tools/library-importer/zig-out/m64importer-macos.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v2
        with:
          install: true
          cache: true

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libgl1-mesa-dev libudev-dev libx11-dev libxcursor-dev libxi-dev

      - name: Test importer
        run: mise run importer-test

      - name: Build importer
        run: mise run importer-build

      - name: Build batched SummerCart deployer
        shell: pwsh
        run: ./tools/library-importer/build-deployer.ps1 -OutputDirectory tools/library-importer/zig-out/bin

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sc64menu
          path: tools/library-importer/zig-out/bin

      - name: Bundle deployer notices
        shell: pwsh
        run: |
          Copy-Item -LiteralPath tools/library-importer/THIRD_PARTY.md -Destination tools/library-importer/zig-out/bin/THIRD_PARTY.md
          Copy-Item -LiteralPath tools/library-importer/sc64deployer-batch-sync.patch -Destination tools/library-importer/zig-out/bin/sc64deployer-batch-sync.patch

      - name: Package importer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path tools/library-importer/zig-out/bin/* -DestinationPath ${{ matrix.package }}

      - name: Package importer (Unix)
        if: runner.os != 'Windows'
        working-directory: tools/library-importer/zig-out/bin
        run: >-
          tar -czf ../${{ matrix.artifact }}.tar.gz
          m64importer sc64deployer sc64menu.n64 THIRD_PARTY.md SC64DEPLOYER_LICENSE.txt
          sc64deployer-batch-sync.patch

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package }}
          if-no-files-found: error

  windows:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-ci')
    needs: approval
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v2
        with:
          install: true
          cache: true

      # Exercises the whole bootstrap on a clean machine: the pinned toolchain,
      # the host tools compiled with Zig, and the generated sprites and fonts.
      # Building by hand cannot catch an asset that only exists locally.
      - name: Build menu
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run menu

      - name: Report ROM hashes
        shell: pwsh
        run: |
          $built = "zig-out/bin/sc64menu.n64"
          if (-not (Test-Path $built)) { throw "Build did not produce $built" }
          $builtHash = (Get-FileHash $built -Algorithm SHA256).Hash
          Write-Host "built   $builtHash"
          if (Test-Path "sc64menu.n64") {
            $trackedHash = (Get-FileHash "sc64menu.n64" -Algorithm SHA256).Hash
            Write-Host "tracked $trackedHash"
            if ($builtHash -ne $trackedHash) {
              # Reported rather than fatal: the filesystem image is not
              # guaranteed byte-reproducible, so a mismatch is a prompt to
              # refresh the tracked ROM, not proof of a broken build.
              Write-Host "::warning::Tracked ROM differs from the build output."
            }
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sc64menu
          path: zig-out/bin/sc64menu.n64
          if-no-files-found: error

  required:
    name: CI
    if: always()
    needs: [approval, windows, importer]
    runs-on: ubuntu-latest
    steps:
      - name: Verify approved build matrix
        env:
          APPROVAL_RESULT: ${{ needs.approval.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          IMPORTER_RESULT: ${{ needs.importer.result }}
        run: |
          test "$APPROVAL_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$IMPORTER_RESULT" = success

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sc64menu
          path: release

      - name: Generate checksum
        working-directory: release
        run: sha256sum sc64menu.n64 > sc64menu.n64.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release/sc64menu.n64
          release/sc64menu.n64.sha256
          --repo "${{ github.repository }}"
          --title "m64menu ${{ github.ref_name }}"
          --generate-notes
          --verify-tag
