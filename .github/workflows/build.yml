name: Build

# Every run verifies the clean-machine build and uploads a workflow artifact.
# Version tags additionally publish that exact artifact as a GitHub Release.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  importer:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: m64importer-windows
            executable: tools/library-importer/zig-out/bin/m64importer.exe
          - os: ubuntu-latest
            artifact: m64importer-linux
            executable: tools/library-importer/zig-out/bin/m64importer
          - os: macos-latest
            artifact: m64importer-macos
            executable: tools/library-importer/zig-out/bin/m64importer
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v2
        with:
          install: true
          cache: true

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev

      - name: Test importer
        run: mise run importer-test

      - name: Build importer
        run: mise run importer-build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.executable }}
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v2
        with:
          install: true
          cache: true

      # Exercises the whole bootstrap on a clean machine: the pinned toolchain,
      # the host tools compiled with Zig, and the generated sprites and fonts.
      # Building by hand cannot catch an asset that only exists locally.
      - name: Build menu
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run menu

      - name: Report ROM hashes
        shell: pwsh
        run: |
          $built = "zig-out/bin/sc64menu.n64"
          if (-not (Test-Path $built)) { throw "Build did not produce $built" }
          $builtHash = (Get-FileHash $built -Algorithm SHA256).Hash
          Write-Host "built   $builtHash"
          if (Test-Path "sc64menu.n64") {
            $trackedHash = (Get-FileHash "sc64menu.n64" -Algorithm SHA256).Hash
            Write-Host "tracked $trackedHash"
            if ($builtHash -ne $trackedHash) {
              # Reported rather than fatal: the filesystem image is not
              # guaranteed byte-reproducible, so a mismatch is a prompt to
              # refresh the tracked ROM, not proof of a broken build.
              Write-Host "::warning::Tracked ROM differs from the build output."
            }
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sc64menu
          path: zig-out/bin/sc64menu.n64
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sc64menu
          path: release

      - name: Generate checksum
        working-directory: release
        run: sha256sum sc64menu.n64 > sc64menu.n64.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release/sc64menu.n64
          release/sc64menu.n64.sha256
          --repo "${{ github.repository }}"
          --title "m64menu ${{ github.ref_name }}"
          --generate-notes
          --verify-tag
